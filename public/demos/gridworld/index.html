<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Watch a Q-learning agent navigate a maze, or take the controls yourself. An interactive example by Mark Bajo.">
  <title>Q-learning playground — Mark Bajo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="playground">
    <header class="topline"><span><i aria-hidden="true"></i> Q-LEARNING PLAYGROUND</span><a href="/writing/a-tiny-world-for-q-learning/" target="_top">Read the note ↗</a></header>
    <div class="metrics"><div><span>TRAINING EPISODES</span><strong id="episodes">800</strong></div><div><span>STEPS</span><strong id="steps">0</strong></div><div><span>RETURN</span><strong id="reward">0</strong></div><span id="mode-label" class="mode-label">Agent ready</span></div>
    <div class="canvas-wrap"><canvas id="world" width="720" height="480" tabindex="0" role="img" aria-label="Maze. Agent starts at the top left, goal is at the bottom right. In take-control mode, use arrow keys or the direction buttons."></canvas></div>
    <div class="legend"><span><i class="agent-dot"></i>Agent</span><span><i class="goal-dot"></i>Goal +20</span><span><i class="wall-dot"></i>Wall</span><span class="step-cost">Each step −1</span></div>
    <div class="controls">
      <label class="select-label">Policy<select id="checkpoint" aria-label="Policy checkpoint"><option value="0">Untrained · 0 episodes</option><option value="50">Learning · 50 episodes</option><option value="800" selected>Trained · 800 episodes</option></select></label>
      <label class="explore-label">Exploration ε <output id="epsilon-value" for="epsilon">0.00</output><input id="epsilon" type="range" min="0" max="1" step="0.05" value="0" aria-describedby="explore-hint"></label>
    </div>
    <div class="buttons"><button id="watch" class="primary" type="button">▶ Watch agent</button><button id="play" type="button">Take control</button><button id="reset" type="button">Reset</button><button id="fullscreen" class="icon-button" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button></div>
    <div id="direction-pad" class="direction-pad" hidden aria-label="Direction controls"><button type="button" data-action="0" aria-label="Move up">↑</button><button type="button" data-action="3" aria-label="Move left">←</button><button type="button" data-action="2" aria-label="Move down">↓</button><button type="button" data-action="1" aria-label="Move right">→</button></div>
    <p id="status" class="status" role="status" aria-label="Experiment status" aria-live="polite">Ready. Watch the policy or find your own way through.</p>
    <p id="explore-hint" class="hint">ε controls random actions during playback. Training uses a fixed seed and ε = 0.25.</p>
    <noscript><p>This demo needs JavaScript to run the simulation.</p></noscript>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
